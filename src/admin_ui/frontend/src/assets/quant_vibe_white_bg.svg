<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- White Background -->
  <rect width="400" height="400" fill="#ffffff"/>
  
  <!-- Simple Q with clean lines -->
  <g transform="translate(200, 160)">
    <!-- Q circle -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#0a0e27" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Q tail -->
    <line x1="35" y1="35" x2="60" y2="60" stroke="#0a0e27" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Single clean wave -->
  <path d="M 100 160 Q 150 130, 200 160 T 300 160" 
        fill="none" 
        stroke="#0a0e27" 
        stroke-width="3" 
        stroke-linecap="round"
        opacity="0.4"/>
  
  <!-- Text -->
  <text x="200" y="290" font-family="Arial, sans-serif" font-size="48" font-weight="700" 
        fill="#0a0e27" text-anchor="middle" letter-spacing="4">
    QUANT VIBE
  </text>
</svg>