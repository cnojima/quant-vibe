  optimization:
    build:
      context: .
      dockerfile: docker/Dockerfile.optimization
    container_name: quant-vibe-optimization
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      # Service mode ('api' or 'worker')
      SERVICE_MODE: ${OPTIMIZATION_MODE:-worker}
      # Redis connection (use service name as host)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # TimescaleDB connection (use service name as host)
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: options_data
      TIMESCALE_USER: quantvibe
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-quantvibe_dev}
      # API settings (when running in API mode)
      API_HOST: 0.0.0.0
      API_PORT: 8200
      # Worker settings
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      MAX_MEMORY_MB: ${MAX_MEMORY_MB:-7000}
      # Logging (WARNING to suppress DEBUG data validation messages)
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      # Force unbuffered Python output for logs
      PYTHONUNBUFFERED: 1
    ports:
      - "8200:8200"  # API port (when in API mode)
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    volumes:
      # Mount entire repo for live code updates
      - .:/app
      # Persist optimization results
      - ./results:/app/results:rw
    networks:
      - quant-vibe-network

  backtest:
    build:
      # context: ./src/backtest
      dockerfile: docker/Dockerfile.backtest
    container_name: quant-vibe-backtest
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      # Service configuration
      WORKER_MODE: "false"  # Set to true to run as worker
      PORT: 8001
      # Redis connection
      REDIS_URL: redis://redis:6379/0
      # Database connection
      DATABASE_URL: postgresql://quantvibe:${TIMESCALE_PASSWORD:-quantvibe_dev}@timescaledb:5432/options_data
      # TimescaleStore specific variables
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: options_data
      TIMESCALE_USER: quantvibe
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-quantvibe_dev}
      # CORS configuration
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      # Data caching
      DATA_CACHE_TTL: 3600
      RESULTS_BASE_DIR: /app/results/backtests
      MAX_CONCURRENT_BACKTESTS: 5
      # Logging
      DEBUG: ${DEBUG:-false}
    volumes:
      - ./src/backtest:/app/backtest:ro
      - ./src/quant_vibe:/app/quant_vibe:ro
      - ./results/backtests:/app/results/backtests:rw
      - ./logs:/app/logs:rw
      - ./reports:/app/reports:rw
    networks:
      - quant-vibe-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backtest-worker:
    build:
      # context: ./src/backtest
      dockerfile: docker/Dockerfile.backtest
    container_name: quant-vibe-backtest-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      backtest:
        condition: service_healthy
    environment:
      # Worker mode
      WORKER_MODE: "true"
      # Redis connection
      REDIS_URL: redis://redis:6379/0
      # Database connection
      DATABASE_URL: postgresql://quantvibe:${TIMESCALE_PASSWORD:-quantvibe_dev}@timescaledb:5432/options_data
      # TimescaleStore specific variables
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: options_data
      TIMESCALE_USER: quantvibe
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-quantvibe_dev}
      # Data caching
      DATA_CACHE_TTL: 3600
      RESULTS_BASE_DIR: /app/results/backtests
      # Logging
      DEBUG: ${DEBUG:-false}
    volumes:
      - ./src/backtest:/app/backtest:ro
      - ./src/quant_vibe:/app/quant_vibe:ro
      - ./results/backtests:/app/results/backtests:rw
      - ./logs:/app/logs:rw
      - ./reports:/app/reports:rw
    networks:
      - quant-vibe-network
    command: ["python", "-m", "backtest.worker"]

networks:
  quant-vibe-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  timescaledb_data:
    driver: local
  live_trading_state:
    driver: local
