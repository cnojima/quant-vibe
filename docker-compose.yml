services:
  redis:
    image: redis:7-alpine
    container_name: quant-vibe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 8gb --maxmemory-policy allkeys-lru
    networks:
      - quant-vibe-network

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: quant-vibe-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: quantvibe
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-quantvibe_dev}
      POSTGRES_DB: options_data
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./src/quant_vibe/data/schema/init_timescale.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantvibe -d options_data"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 1g
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    command: >
      postgres
      -c shared_preload_libraries=timescaledb
      -c max_connections=200
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=8MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    networks:
      - quant-vibe-network

  token_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.streaming
    container_name: quant-vibe-token-service
    restart: unless-stopped
    ports:
      - "8100:8100"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Schwab API credentials
      SCHWAB_API_KEY: ${SCHWAB_API_KEY}
      SCHWAB_API_SECRET: ${SCHWAB_API_SECRET}
      SCHWAB_CALLBACK_URL: ${SCHWAB_CALLBACK_URL}
      # Token service settings
      TOKEN_SERVICE_HOST: 0.0.0.0
      TOKEN_SERVICE_PORT: 8100
      TOKEN_REFRESH_INTERVAL_MINUTES: 14
      # Redis connection (for event publishing)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      TOKEN_SERVICE_ENABLE_REDIS: "true"
    volumes:
      # Mount entire repo for live code updates
      - .:/app
      # Bind mount tokens for easy sharing across services
      - ./tokens:/app/tokens
    networks:
      - quant-vibe-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: ["python", "scripts/run_token_service.py"]

  streaming:
    build:
      context: .
      dockerfile: docker/Dockerfile.streaming
    container_name: quant-vibe-streaming
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      token_service:
        condition: service_healthy
    environment:
      # Token service (centralized OAuth management)
      TOKEN_SERVICE_URL: http://token_service:8100
      # Schwab API credentials (legacy - can be removed after migration)
      SCHWAB_API_KEY: ${SCHWAB_API_KEY}
      SCHWAB_API_SECRET: ${SCHWAB_API_SECRET}
      SCHWAB_CALLBACK_URL: ${SCHWAB_CALLBACK_URL}
      SCHWAB_ACCOUNT_NUMBER: ${SCHWAB_ACCOUNT_NUMBER}
      # Redis connection (use service name as host)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # TimescaleDB connection (use service name as host)
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: options_data
      TIMESCALE_USER: quantvibe
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-quantvibe_dev}
      # Logging
      STREAMING_LOG_LEVEL: ${STREAMING_LOG_LEVEL:-${LOG_LEVEL:-INFO}}
      # Force unbuffered Python output for logs
      PYTHONUNBUFFERED: 1
    volumes:
      # Mount entire repo for live code updates
      - .:/app
      # Bind mount tokens for easy sharing across services (development)
      - ./tokens:/app/tokens
    networks:
      - quant-vibe-network
    command: ["python", "scripts/run_streaming.py"]

  live_trading_real:
    build:
      context: .
      dockerfile: docker/Dockerfile.streaming
    container_name: quant-vibe-live-trading-real
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      token_service:
        condition: service_healthy
      streaming:
        condition: service_started
    environment:
      # Token service (centralized OAuth management)
      TOKEN_SERVICE_URL: http://token_service:8100
      # Schwab API credentials (legacy - can be removed after migration)
      SCHWAB_API_KEY: ${SCHWAB_API_KEY}
      SCHWAB_API_SECRET: ${SCHWAB_API_SECRET}
      SCHWAB_CALLBACK_URL: ${SCHWAB_CALLBACK_URL}
      SCHWAB_ACCOUNT_NUMBER: ${SCHWAB_ACCOUNT_NUMBER}
      # Redis connection (use service name as host)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # TimescaleDB connection (use service name as host)
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: options_data
      TIMESCALE_USER: quantvibe
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-quantvibe_dev}
      # Logging
      LIVE_TRADING_LOG_LEVEL: ${LIVE_TRADING_LOG_LEVEL:-${LOG_LEVEL:-INFO}}
    volumes:
      # Mount entire repo for live code updates
      - .:/app
      # Bind mount tokens for easy sharing across services (development)
      - ./tokens:/app/tokens
      # Persist state across container restarts
      - live_trading_state:/app/state
    networks:
      - quant-vibe-network
    command: ["python", "scripts/run_trading_launcher.py", "--real-only"]

  live_trading_paper:
    build:
      context: .
      dockerfile: docker/Dockerfile.streaming
    container_name: quant-vibe-live-trading-paper
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      token_service:
        condition: service_healthy
      streaming:
        condition: service_started
    environment:
      # Token service (centralized OAuth management)
      TOKEN_SERVICE_URL: http://token_service:8100
      # Schwab API credentials (legacy - can be removed after migration)
      SCHWAB_API_KEY: ${SCHWAB_API_KEY}
      SCHWAB_API_SECRET: ${SCHWAB_API_SECRET}
      SCHWAB_CALLBACK_URL: ${SCHWAB_CALLBACK_URL}
      SCHWAB_ACCOUNT_NUMBER: ${SCHWAB_ACCOUNT_NUMBER}
      # Redis connection (use service name as host)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # TimescaleDB connection (use service name as host)
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: options_data
      TIMESCALE_USER: quantvibe
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-quantvibe_dev}
      # Logging
      LIVE_TRADING_LOG_LEVEL: ${LIVE_TRADING_LOG_LEVEL:-${LOG_LEVEL:-INFO}}
    volumes:
      # Mount entire repo for live code updates
      - .:/app
      # Bind mount tokens for easy sharing across services (development)
      - ./tokens:/app/tokens
      # Persist state across container restarts
      - live_trading_state:/app/state
    networks:
      - quant-vibe-network
    command: ["python", "scripts/run_trading_launcher.py", "--paper-only"]

  admin_ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin_ui
    container_name: quant-vibe-admin-ui
    restart: unless-stopped
    ports:
      - "8000:8000"
    user: root  # Required for Docker socket access
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      # Application
      DEBUG: ${DEBUG:-false}
      API_PREFIX: /api
      # Security (override these in .env)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-key}
      # CORS origins (include nginx frontend)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000,http://localhost:80,http://localhost}
      # Schwab API credentials (for token refresh)
      SCHWAB_API_KEY: ${SCHWAB_API_KEY}
      SCHWAB_API_SECRET: ${SCHWAB_API_SECRET}
      SCHWAB_CALLBACK_URL: ${SCHWAB_CALLBACK_URL}
      # Redis connection (use Docker service names for container networking)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # TimescaleDB connection (use Docker service names for container networking)
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: options_data
      TIMESCALE_USER: quantvibe
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-quantvibe_dev}
      # Pushover notifications (for optimization completion alerts)
      PUSHOVER_API_TOKEN: ${PUSHOVER_API_TOKEN:-}
      PUSHOVER_USER_KEY: ${PUSHOVER_USER_KEY:-}
      PUSHOVER_DEVICE: ${PUSHOVER_DEVICE:-}
      PUSHOVER_ENABLED: ${PUSHOVER_ENABLED:-true}
    volumes:
      # Mount Docker socket for service control
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount config, logs, tokens, scripts, src, and reports directories
      - ./config:/app/config:rw
      - ./logs:/app/logs:rw
      - ./tokens:/app/tokens:rw
      - ./reports:/app/reports:rw
      - ./scripts:/app/scripts:ro
      - ./src:/app/src:ro
    networks:
      - quant-vibe-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  admin_ui_frontend:
    build:
      context: . #/src/admin_ui/frontend
      dockerfile: docker/Dockerfile.nginx
    container_name: quant-vibe-admin-ui-frontend
    restart: unless-stopped
    user: root  # Required to read Let's Encrypt certificates
    ports:
      - "80:80"        # HTTP (redirects to HTTPS)
      - "443:443"      # HTTPS for main UI
      - "53430:53430"  # OAuth callback HTTPS port
    depends_on:
      admin_ui:
        condition: service_healthy
    volumes:
      # Mount Let's Encrypt certificates from host
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - quant-vibe-network
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--tries=1", "--spider", "https://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  watcher:
    build:
      context: .
      dockerfile: docker/Dockerfile.streaming
    container_name: quant-vibe-watcher
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      # Redis connection (use service name as host)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Pushover notifications (optional)
      PUSHOVER_API_TOKEN: ${PUSHOVER_API_TOKEN:-}
      PUSHOVER_USER_KEY: ${PUSHOVER_USER_KEY:-}
      PUSHOVER_ENABLED: ${PUSHOVER_ENABLED:-true}
    volumes:
      # Mount entire repo for live code updates
      - .:/app
      # Bind mount Docker socket for container health checks
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - quant-vibe-network
    command: ["python", "scripts/run_watcher.py"]

  dyndns:
    build:
      context: .
      dockerfile: docker/Dockerfile.streaming
    container_name: quant-vibe-dyndns
    restart: unless-stopped
    environment:
      # Sonic.net DynDNS credentials
      SONIC_DYNDNS_USERID: ${SONIC_DYNDNS_USERID}
      SONIC_DYNDNS_APIKEY: ${SONIC_DYNDNS_APIKEY}
      SONIC_DYNDNS_HOSTNAME: ${SONIC_DYNDNS_HOSTNAME}
      # Optional settings
      SONIC_DYNDNS_RECORD_TYPE: ${SONIC_DYNDNS_RECORD_TYPE:-A}
      SONIC_DYNDNS_TTL: ${SONIC_DYNDNS_TTL:-300}
      SONIC_DYNDNS_UPDATE_INTERVAL: ${SONIC_DYNDNS_UPDATE_INTERVAL:-300}
      SONIC_DYNDNS_FORCE_UPDATE: ${SONIC_DYNDNS_FORCE_UPDATE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Mount entire repo for live code updates
      - .:/app
    networks:
      - quant-vibe-network
    command: ["python", "scripts/run_dyndns.py"]

  # scheduler:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.scheduler
