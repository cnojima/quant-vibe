services:
  redis:
    image: redis:7-alpine
    container_name: quant-vibe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - quant-vibe-network

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: quant-vibe-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: quantvibe
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-quantvibe_dev}
      POSTGRES_DB: options_data
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./scripts/init_timescale.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantvibe -d options_data"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 1g
    command: >
      postgres
      -c shared_preload_libraries=timescaledb
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    networks:
      - quant-vibe-network

  token_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.streaming
    container_name: quant-vibe-token-service
    restart: unless-stopped
    ports:
      - "8100:8100"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Schwab API credentials
      SCHWAB_API_KEY: ${SCHWAB_API_KEY}
      SCHWAB_API_SECRET: ${SCHWAB_API_SECRET}
      SCHWAB_CALLBACK_URL: ${SCHWAB_CALLBACK_URL}
      # Token service settings
      TOKEN_SERVICE_HOST: 0.0.0.0
      TOKEN_SERVICE_PORT: 8100
      TOKEN_REFRESH_INTERVAL_MINUTES: 14
      # Redis connection (for event publishing)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      TOKEN_SERVICE_ENABLE_REDIS: "true"
    volumes:
      # Mount entire repo for live code updates
      - .:/app
      # Bind mount tokens for easy sharing across services
      - ./tokens:/app/tokens
    networks:
      - quant-vibe-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: ["python", "scripts/run_token_service.py"]

  streaming:
    build:
      context: .
      dockerfile: docker/Dockerfile.streaming
    container_name: quant-vibe-streaming
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      token_service:
        condition: service_healthy
    environment:
      # Token service (centralized OAuth management)
      TOKEN_SERVICE_URL: http://token_service:8100
      # Schwab API credentials (legacy - can be removed after migration)
      SCHWAB_API_KEY: ${SCHWAB_API_KEY}
      SCHWAB_API_SECRET: ${SCHWAB_API_SECRET}
      SCHWAB_CALLBACK_URL: ${SCHWAB_CALLBACK_URL}
      SCHWAB_ACCOUNT_NUMBER: ${SCHWAB_ACCOUNT_NUMBER}
      # Redis connection (use service name as host)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # TimescaleDB connection (use service name as host)
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: options_data
      TIMESCALE_USER: quantvibe
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-quantvibe_dev}
    volumes:
      # Mount entire repo for live code updates
      - .:/app
      # Bind mount tokens for easy sharing across services (development)
      - ./tokens:/app/tokens
    networks:
      - quant-vibe-network
    command: ["python", "scripts/stream_spxw_schwabdev.py"]

  live_trading:
    build:
      context: .
      dockerfile: docker/Dockerfile.streaming
    container_name: quant-vibe-live-trading
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      token_service:
        condition: service_healthy
      streaming:
        condition: service_started
    environment:
      # Token service (centralized OAuth management)
      TOKEN_SERVICE_URL: http://token_service:8100
      # Schwab API credentials (legacy - can be removed after migration)
      SCHWAB_API_KEY: ${SCHWAB_API_KEY}
      SCHWAB_API_SECRET: ${SCHWAB_API_SECRET}
      SCHWAB_CALLBACK_URL: ${SCHWAB_CALLBACK_URL}
      SCHWAB_ACCOUNT_NUMBER: ${SCHWAB_ACCOUNT_NUMBER}
      # Redis connection (use service name as host)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # TimescaleDB connection (use service name as host)
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: options_data
      TIMESCALE_USER: quantvibe
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-quantvibe_dev}
    volumes:
      # Mount entire repo for live code updates
      - .:/app
      # Bind mount tokens for easy sharing across services (development)
      - ./tokens:/app/tokens
      # Persist state across container restarts
      - live_trading_state:/app/state
    networks:
      - quant-vibe-network
    command: ["python", "scripts/run_live_trading.py"]

  admin_ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin_ui
    container_name: quant-vibe-admin-ui
    restart: unless-stopped
    ports:
      - "8000:8000"
    user: root  # Required for Docker socket access
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      # Application
      DEBUG: ${DEBUG:-false}
      API_PREFIX: /api
      # Security (override these in .env)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-key}
      # CORS origins
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
      # Schwab API credentials (for token refresh)
      SCHWAB_API_KEY: ${SCHWAB_API_KEY}
      SCHWAB_API_SECRET: ${SCHWAB_API_SECRET}
      SCHWAB_CALLBACK_URL: ${SCHWAB_CALLBACK_URL}
      # Redis connection (use service name as host)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # TimescaleDB connection (use service name as host)
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: options_data
      TIMESCALE_USER: quantvibe
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-quantvibe_dev}
    volumes:
      # Mount Docker socket for service control
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount config, logs, and tokens directories
      - ./config:/app/config:rw
      - ./logs:/app/logs:rw
      - ./tokens:/app/tokens:rw
    networks:
      - quant-vibe-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  quant-vibe-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  timescaledb_data:
    driver: local
  live_trading_state:
    driver: local
