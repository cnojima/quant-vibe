engine:
  initial_capital: 100000
  parallel_execution: false
  auto_save_results: true
  output_dir: reports/backtests
date_range:
  preset: this_month
  custom:
    start_date: '2025-12-01'
    end_date: '2025-12-31'
  trading_days_only: true
  market_hours_only: true
strategies:
  enabled:
  - name: bullish_vertical_put
    enabled: true
    params:
      max_trades_daily: 3
      spread_width: 10
      observation_period: 15
      pullback_amount: 30
      profit_target_min: 0.5
      profit_target_max: 2
      trailing_stop_pct: 0.30  # 30% for 0-DTE options volatility (was 0.05)
      min_dte: 0
      max_dte: 2
      num_spreads: 10
      min_volume: 30
      min_bid_ask_spread_pct: 15
  - name: bullish_vertical_call
    enabled: true
    params:
      max_trades_daily: 1
      spread_width: 10
      observation_period: 15
      pullback_amount: 25
      profit_target_min: 0.5
      profit_target_max: 1
      trailing_stop_pct: 0.30  # 30% for 0-DTE options volatility (was 0.05)
      min_dte: 0
      max_dte: 2
      num_spreads: 10
  - name: bearish_iv_scalp
    enabled: true
    params:
      max_trades_daily: 2
      spread_width: 10
      observation_period: 15
      iv_threshold: 0.15  # 15% minimum IV
      iv_spike_pct: 0.10  # 10% IV increase required
      profit_target_min: 0.30  # 30% profit target
      profit_target_max: 0.50  # 50% profit target
      trailing_stop_pct: 0.03  # Tight 3% trailing stop
      stop_loss_pct: 0.75  # 75% stop loss
      min_dte: 0  # 0DTE only
      max_dte: 0  # 0DTE only
      num_spreads: 5  # Smaller size for scalping
      min_volume: 20
      min_bid_ask_spread_pct: 15
      momentum_lookback: 5
      iv_lookback: 30
data_source:
  underlying_ticker: SPX
  db_profile: auto
  min_dte: 0
  max_dte: 2
  verbose: true
reporting:
  print_trade_details: true
  print_educational_metrics: true
  print_performance_summary: true
  save_equity_chart: false
  generate_html_report: false
output:
  timestamp_format: '%Y%m%d_%H%M%S'
  save_trades: true
  save_equity_curve: true
  save_summary: true
  save_log: true
logging:
  log_level: INFO
  tee_output: true
  log_dir: logs/backtests
batch:
  enabled: false
