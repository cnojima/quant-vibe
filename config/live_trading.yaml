# Live Trading Engine Configuration
# ==================================
# This file configures the live trading engine for options trading.
#
# ⚠️  IMPORTANT: Always start with paper_trading: true
# ⚠️  Only switch to live trading after extensive testing
#
# NOTE: Schwab does not offer paper trading accounts via API.
# When paper_trading: true, orders are simulated internally with
# realistic slippage models. No real broker orders are submitted.

engine:
  # Paper trading mode (CRITICAL SAFETY FEATURE)
  # true = Simulated fills (no real orders)
  # false = Live orders submitted to Schwab API
  paper_trading: true

  # Data feed mode (RECOMMENDED: use_redis_feed = true)
  # true = Subscribe to StreamingService via Redis (single connection, lower load)
  # false = Create direct schwabdev connection (legacy mode, duplicate connections)
  use_redis_feed: true

  # Maximum concurrent positions across all strategies
  max_positions: 5

  # Maximum capital per single trade
  max_capital_per_trade: 10000

  # Daily loss limit (as percentage of starting capital)
  # Engine will stop trading if daily loss exceeds this
  daily_loss_limit_pct: 0.05  # 5%

  # Timeout before considering data stale (seconds)
  data_stale_timeout_seconds: 300  # 5 minutes

# Strategy Configuration
# Strategies to run (empty by default - add as needed)
strategies:
  enabled:
    # Example: Enable bullish vertical put strategy
    - name: bullish_vertical_put
      enabled: true
      params:
        # Trade frequency
        max_trades_daily: 1           # Maximum trades per day (default: 1)

        # Spread parameters
        spread_width: 10.0           # Width of spread in dollars

        # Entry logic
        observation_period: 30        # Minutes to observe market at open
        pullback_amount: 50.0         # Dollar pullback for entry signal

        # Exit logic
        profit_target_min: 0.5        # 50% profit (minimum target)
        profit_target_max: 1.0        # 100% profit (maximum target)
        trailing_stop_pct: 0.05       # 5% trailing stop

        # Option selection
        min_dte: 0                    # Minimum days to expiration
        max_dte: 45                   # Maximum days to expiration
        num_spreads: 10               # Number of spreads per trade

        # Liquidity filters
        min_volume: 50                # Minimum volume per contract
        min_bid_ask_spread_pct: 10.0  # Maximum bid/ask spread %

    # Example: Enable bullish vertical call strategy
    # - name: bullish_vertical_call
    #   enabled: true
    #   params:
    #     max_trades_daily: 1           # Maximum trades per day (default: 1)
    #     spread_width: 25.0
    #     profit_target_pct: 0.50
    #     stop_loss_pct: 0.30
    #     min_dte: 0
    #     max_dte: 2

  # Available strategies:
  # - bullish_vertical_put: Credit spread (sell put, buy lower put)
  # - bullish_vertical_call: Debit spread (buy call, sell higher call)

# Data Feed Configuration
data_feed:
  # Number of bars to keep in memory (sliding window)
  window_size: 100  # Last 100 minutes

  # Bar aggregation interval (seconds)
  # NOTE: Only used if use_redis_feed = false
  aggregate_interval_seconds: 60  # 1-minute bars

  # Days to expiration range for streaming
  # NOTE: Only used if use_redis_feed = false
  # If using Redis feed, configure these in StreamingService
  max_dte: 45
  min_dte: 0

  # Strike range as percentage of underlying price
  # NOTE: Only used if use_redis_feed = false
  # If using Redis feed, configure this in StreamingService
  strike_range_pct: 0.10  # ±10% from ATM

# Redis Configuration (for use_redis_feed = true)
redis:
  # Redis connection settings
  # Leave as null to use environment variables (REDIS_HOST, REDIS_PORT, REDIS_DB)
  host: null  # Defaults to REDIS_HOST env var or 'localhost'
  port: null  # Defaults to REDIS_PORT env var or 6379
  db: null    # Defaults to REDIS_DB env var or 0

# Risk Management
risk:
  # Maximum total exposure (sum of all positions)
  max_total_exposure: 100000

  # Maximum drawdown before stopping (percentage)
  max_drawdown_pct: 0.10  # 10%

  # Position concentration limit (single position / total capital)
  position_concentration_limit: 0.30  # 30%

  # Additional risk limits (for future implementation)
  # max_contracts_per_symbol: 100
  # max_delta_exposure: 1000
  # correlation_limit: 0.70

# OCO (One Cancels Other) Order Protection
oco:
  # Enable OCO orders (profit target + stop loss submitted to broker)
  enabled: false  # Set to true to enable broker-level protection

  # Default profit target (as percentage of entry price)
  # Position can override this with its own profit_target
  profit_target_pct: 0.50  # 50% profit

  # Default stop loss (as percentage of entry price, negative)
  # Position can override this with its own stop_loss
  stop_loss_pct: -0.30  # -30% loss

  # Use market order for stop loss (faster exit, may get worse price)
  # If false, uses STOP_LIMIT (safer but might not fill)
  use_market_on_stop: true

  # Verify OCO child orders were placed after entry fills
  verify_placement: true

  # Fallback to engine monitoring if OCO placement fails
  fallback_to_monitoring: true

  # Note: In simulated mode, OCO structures are built and logged
  # but not actually submitted (engine monitoring is still used)

# Monitoring & Alerts
monitoring:
  # Status update interval (seconds)
  status_update_interval_seconds: 60

  # Health check interval (seconds)
  health_check_interval_seconds: 30

  # Email alerts (requires SMTP configuration)
  email_alerts_enabled: false
  email_recipients: []
  #   - your.email@example.com

  # Alert conditions
  alerts:
    on_position_open: false
    on_position_close: true
    on_daily_loss_limit: true
    on_max_drawdown: true
    on_data_stale: true
    on_order_error: true

# Logging Configuration
# NOTE: Log level is now controlled by LIVE_TRADING_LOG_LEVEL env var (or LOG_LEVEL fallback)
# These settings are kept for reference but log_level is ignored
logging:
  # Directory for log files (hardcoded in engine.py)
  log_dir: logs/live_trading

  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  # DEPRECATED: Use LIVE_TRADING_LOG_LEVEL or LOG_LEVEL environment variable instead
  log_level: INFO

  # Rotate logs daily (handled by normalized logging)
  rotation: daily

  # Keep logs for N days (handled by normalized logging)
  retention_days: 30

# Database Configuration (uses TimescaleDB by default)
database:
  # Use TimescaleDB from .env settings
  use_timescale: true

  # Override connection (optional)
  # host: localhost
  # port: 5432
  # database: options_data
  # user: quantvibe
  # password: quantvibe_dev

# Emergency Controls
emergency:
  # Enable kill switch (close all positions immediately)
  kill_switch_enabled: true

  # Close all positions at end of day
  close_all_at_eod: true

  # End of day close time (ET)
  eod_close_time: "15:55"  # 5 minutes before market close

# Testing & Development
development:
  # Enable detailed debug logging
  debug_mode: false

  # Simulate fills immediately (for testing)
  instant_fills: false

  # Save raw stream messages to file
  save_stream_messages: false
