engine:
  paper_trading: true
  use_redis_feed: true
  max_positions: 5
  max_capital_per_trade: 10000
  daily_loss_limit_pct: 0.05
  data_stale_timeout_seconds: 300
strategies:
  enabled:
  - name: bullish_vertical_put
    enabled: true
    params:
      max_trades_daily: 1
      spread_width: 10
      observation_period: 30
      pullback_amount: 50
      profit_target_min: 0.5
      profit_target_max: 1
      trailing_stop_pct: 0.05
      min_dte: 0
      max_dte: 2
      num_spreads: 10
      min_volume: 50
      min_bid_ask_spread_pct: 10
  - name: bullish_vertical_call
    enabled: true
    params:
      max_trades_daily: 1
      spread_width: 20
      observation_period: 30
      pullback_amount: 50
      profit_target_min: 0.5
      profit_target_max: 1
      trailing_stop_pct: 0.05
      min_dte: 0
      max_dte: 2
      num_spreads: 10
  - name: bearish_iv_scalp
    enabled: false
    params:
      spread_width: 10
      observation_period: 15
      iv_threshold: 0.15
      iv_spike_pct: 0.1
      profit_target_min: 0.3
      profit_target_max: 0.5
      trailing_stop_pct: 0.03
      stop_loss_pct: 0.75
      min_dte: 0
      max_dte: 0
      num_spreads: 1
      min_volume: 20
      min_bid_ask_spread_pct: 15
      max_trades_daily: 2
      momentum_lookback: 5
      iv_lookback: 30
  - name: coin_toss
    enabled: false
    params:
      target_price: 2
      buy_limit: 1
      sell_target: 2
      price_tolerance: 0.5
      max_trades_daily: 5
      quantity: 10
      min_dte: 0
      max_dte: 0
      profit_target_pct: 1
      stop_loss_pct: null
  - name: coin_toss_limit
    enabled: false
    params:
      target_contract_price: 2
      limit_buy_price: 1
      profit_target_price: 2
      otm_percent_min: 0.1
      otm_percent_max: 0.15
      price_tolerance: 1
      max_trades_daily: 5
      quantity: 10
      min_dte: 0
      max_dte: 0
      stop_loss_pct: 0.5
      order_expiry_minutes: 60
  - name: bollinger_band
    enabled: false
    params:
      target_price: 2
      buy_limit: 1
      sell_target: 2
      otm_percent_min: 0.1
      otm_percent_max: 0.15
      price_tolerance: 1
      max_trades_daily: 5
      quantity: 10
      min_dte: 0
      max_dte: 0
      profit_target_pct: 1
      stop_loss_pct: 0.5
      bb_period: 20
      bb_std: 2
      bb_threshold: 0
  - name: bollinger_band_limit
    enabled: true
    params:
      target_contract_price: 2
      limit_buy_price: 1
      profit_target_price: 2
      otm_percent_min: 0.1
      otm_percent_max: 0.15
      price_tolerance: 1
      max_trades_daily: 5
      quantity: 10
      min_dte: 0
      max_dte: 0
      stop_loss_pct: 0.5
      order_expiry_minutes: 60
      bb_period: 20
      bb_std: 2
      bb_threshold: 0
  - name: naive_bullish_put
    enabled: true
    params:
      min_dte: 0
      max_dte: 0
      max_trades_daily: 10
      spread_width: 20
      profit_target: 0.5
      num_spreads: 10
  - name: hail_mary
    enabled: false
    params:
      otm_percent_min: 0.05
      otm_percent_max: 0.1
      entry_time_before_close: 15
      num_contracts: 10
      trailing_stop_pct: 0.05
      min_volume: 50
      max_bid_ask_spread_pct: 15.0
      max_trades_daily: 1
  - name: throckmorton_credit_ladder
    enabled: true
    params:
      min_dte: 0
      max_dte: 45
      max_trades_daily: 1
      spread_width: 50.0
      wait_period_minutes: 60
      initial_ladder_count: 1
      ladder_increment: 1
      max_ladders: 5
      profit_target_pct: 0.7
      num_spreads: 1
      min_volume: 50
data_feed:
  window_size: 100
  aggregate_interval_seconds: 60
  max_dte: 45
  min_dte: 0
  strike_range_pct: 0.1
redis:
  host: null
  port: null
  db: null
risk:
  max_total_exposure: 100000
  max_drawdown_pct: 0.1
  position_concentration_limit: 0.3
oco:
  enabled: false
  profit_target_pct: 0.5
  stop_loss_pct: -0.3
  use_market_on_stop: true
  verify_placement: true
  fallback_to_monitoring: true
monitoring:
  status_update_interval_seconds: 60
  health_check_interval_seconds: 30
  email_alerts_enabled: false
  email_recipients: []
  alerts:
    on_position_open: false
    on_position_close: true
    on_daily_loss_limit: true
    on_max_drawdown: true
    on_data_stale: true
    on_order_error: true
notifications:
  pushover:
    enabled: true
    notify_on_start: true
    notify_on_stop: true
    notify_on_position_open: true
    notify_on_position_close: true
    notify_on_order_fill: false
    notify_on_order_reject: true
    notify_on_risk_alert: true
    notify_on_error: true
    notify_daily_summary: true
    min_pnl_notify: null
logging:
  log_dir: logs/live_trading
  log_level: INFO
  rotation: daily
  retention_days: 30
database:
  use_timescale: true
emergency:
  kill_switch_enabled: true
  close_all_at_eod: true
  eod_close_time: '15:55'
development:
  debug_mode: false
  instant_fills: false
  save_stream_messages: false
