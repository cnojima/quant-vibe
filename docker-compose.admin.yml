version: '3.8'

services:
  admin_ui:
    build:
      context: .
      dockerfile: Dockerfile.admin_ui
    container_name: quant-vibe-admin-ui
    ports:
      - "8000:8000"
    environment:
      # Application
      - DEBUG=false
      - API_PREFIX=/api

      # Security (override these in .env)
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-secret-key}

      # CORS origins
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000

      # Redis
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}

      # TimescaleDB
      - TIMESCALE_HOST=${TIMESCALE_HOST:-timescaledb}
      - TIMESCALE_PORT=${TIMESCALE_PORT:-5432}
      - TIMESCALE_DB=${TIMESCALE_DB:-options_data}
      - TIMESCALE_USER=${TIMESCALE_USER:-quantvibe}
      - TIMESCALE_PASSWORD=${TIMESCALE_PASSWORD:-quantvibe_dev}

    volumes:
      # Mount Docker socket for service control
      - /var/run/docker.sock:/var/run/docker.sock

      # Mount config, logs, and tokens directories
      - ./config:/app/config:rw
      - ./logs:/app/logs:rw
      - ./tokens:/app/tokens:rw

    networks:
      - quant-vibe-network

    depends_on:
      - redis
      - timescaledb

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  quant-vibe-network:
    external: true

# DEPRECATED: This file is kept for reference only.
# The admin_ui service is now integrated into the main docker-compose.yml
#
# To use admin UI:
# 1. Use the main docker-compose.yml: docker-compose up -d
# 2. Access at http://localhost:8000/docs
#
# This file can be used if you want to run admin UI separately:
# 1. Ensure main services are running: docker-compose up -d redis timescaledb
# 2. Start admin UI separately: docker-compose -f docker-compose.admin.yml up -d
# 3. Access at http://localhost:8000/docs
